[project]
name = "wsnote"
version = "0.1.0"
description = "本地优先的 Markdown 个人知识库（second brain）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "python-frontmatter>=1.1",
    "rank-bm25>=0.2",
    "sentence-transformers>=2.6",
    "faiss-cpu>=1.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx[test]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
